// ---------- imagens de execução (Free Exercise DB, domínio público) ----------
const FREE_DB_JSON = "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/dist/exercises.json";
const FREE_DB_IMG_BASE = "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/dist/exercises/";
let _cacheDataset = null;
async function carregarDatasetImagens() {
  if (_cacheDataset) return _cacheDataset;
  const r = await fetch(FREE_DB_JSON);
  _cacheDataset = await r.json();
  return _cacheDataset;
}
function normalizar(s) { return s.toLowerCase().replace(/[^a-z0-9 ]/g, " ").split(" ").filter(Boolean); }
function acharMelhorMatch(dataset, termo) {
  const alvo = normalizar(termo);
  let melhor = null, melhorScore = 0;
  for (const ex of dataset) {
    const score = alvo.filter((p) => normalizar(ex.name).includes(p)).length;
    if (score > melhorScore) { melhorScore = score; melhor = ex; }
  }
  return melhorScore > 0 ? melhor : null;
}
function DemoExercicio({ termoBusca, tamanho = 56 }) {
  const [frames, setFrames] = useState(null);
  const [frameAtual, setFrameAtual] = useState(0);
  const [erro, setErro] = useState(false);
  useEffect(() => {
    let ativo = true;
    (async () => {
      try {
        const dataset = await carregarDatasetImagens();
        const match = acharMelhorMatch(dataset, termoBusca);
        if (!match || !match.images || !match.images.length) { if (ativo) setErro(true); return; }
        if (ativo) setFrames(match.images.map((img) => FREE_DB_IMG_BASE + img));
      } catch (e) { if (ativo) setErro(true); }
    })();
    return () => { ativo = false; };
  }, [termoBusca]);
  useEffect(() => {
    if (!frames || frames.length < 2) return;
    const id = setInterval(() => setFrameAtual((f) => (f + 1) % frames.length), 700);
    return () => clearInterval(id);
  }, [frames]);
  const estiloBase = { width: tamanho, height: tamanho, background: SURFACE, border: "1px solid " + BORDER };
  if (erro || !termoBusca) return <div className="flex items-center justify-center rounded-lg shrink-0" style={estiloBase}>🏋️</div>;
  if (!frames) return <div className="flex items-center justify-center rounded-lg shrink-0" style={estiloBase}><div className="spinner"></div></div>;
  return <div className="rounded-lg overflow-hidden shrink-0" style={estiloBase}><img src={frames[frameAtual]} alt="" className="w-full h-full object-cover" /></div>;
}

// ---------- IA ----------
function getApiKey() { return localStorage.getItem("sobrecarga_api_key") || ""; }

async function chamarIA(prompt, { esperarJson = false } = {}) {
  const key = getApiKey();
  if (!key) throw new Error("sem chave de API configurada");
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": key,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({ model: "claude-sonnet-5", max_tokens: 500, messages: [{ role: "user", content: prompt }] }),
  });
  if (!response.ok) throw new Error("falha na chamada da IA");
  const data = await response.json();
  const texto = (data.content || []).map((c) => c.text || "").join("");
  if (!esperarJson) return texto.trim();
  return JSON.parse(texto.replace(/```json|```/g, "").trim());
}

function progressaoFallback(ex, sets) {
  const mediaRir = sets.reduce((a, s) => a + s.rir, 0) / sets.length;
  const todasNoTeto = sets.every((s) => s.reps >= ex.repMax);
  if (todasNoTeto && mediaRir >= 2) return { peso: round5(ex.pesoAtual + ex.incremento), repsAlvo: ex.repMin + "-" + ex.repMax, motivo: "bateu o teto de reps com folga — hora de subir a carga." };
  if (mediaRir <= 0.5) return { peso: round5(ex.pesoAtual), repsAlvo: ex.repMin + "-" + ex.repMax, motivo: "esforço muito alto — mantenha a carga." };
  return { peso: round5(ex.pesoAtual), repsAlvo: ex.repMin + "-" + ex.repMax, motivo: "dentro da faixa — repita a carga e busque mais reps." };
}

async function gerarSugestaoIA(ex, perfil) {
  const historicoRecente = ex.historico.slice(-5).map((h) => ({ sets: h.sets.map((s) => ({ peso: s.peso, reps: s.reps, rir: s.rir })) }));
  const prompt = 'Você é um preparador físico especialista em treinamento baseado em evidência (RP, dupla progressão, RIR).\n' +
    'Exercício: ' + ex.nome + ' | grupo: ' + ex.grupo + '\n' +
    'Faixa alvo de repetições: ' + ex.repMin + ' a ' + ex.repMax + ' | incremento padrão: ' + ex.incremento + 'kg\n' +
    'Fase nutricional do usuário: ' + (perfil && perfil.fase ? perfil.fase : "não informado") + '\n' +
    'Histórico recente (RIR = repetições em reserva, 0=falha, 4=muito fácil): ' + JSON.stringify(historicoRecente) + '\n\n' +
    'Decida carga e reps-alvo pra PRÓXIMA sessão. Responda APENAS JSON: {"peso": numero, "repsAlvo": "8-10", "motivo": "uma frase curta em português"}';
  try {
    const r = await chamarIA(prompt, { esperarJson: true });
    if (typeof r.peso !== "number" || !r.repsAlvo || !r.motivo) throw new Error("formato inesperado");
    return r;
  } catch (e) {
    return progressaoFallback(ex, ex.historico[ex.historico.length - 1].sets);
  }
}

// ---------- telas ----------
function calcularDiasTreinadosSemana(exercicios) {
  const seteDiasAtras = Date.now() - 7 * 24 * 60 * 60 * 1000;
  const dias = new Set();
  exercicios.forEach((ex) => ex.historico.forEach((h) => { if (new Date(h.data).getTime() >= seteDiasAtras) dias.add(new Date(h.data).toDateString()); }));
  return dias.size;
}
function calcularVolumeSemana(exercicios) {
  const seteDiasAtras = Date.now() - 7 * 24 * 60 * 60 * 1000;
  let total = 0;
  exercicios.forEach((ex) => ex.historico.forEach((h) => { if (new Date(h.data).getTime() >= seteDiasAtras) h.sets.forEach((s) => { total += (s.peso || 0) * (s.reps || 0); }); }));
  return Math.round(total);
}
function diasComTreinoNoMes(exercicios, offsetMeses) {
  const ref = new Date(); ref.setMonth(ref.getMonth() - offsetMeses);
  const diasNoMes = new Date(ref.getFullYear(), ref.getMonth() + 1, 0).getDate();
  const treinados = new Set();
  exercicios.forEach((ex) => ex.historico.forEach((h) => { const d = new Date(h.data); if (d.getFullYear() === ref.getFullYear() && d.getMonth() === ref.getMonth()) treinados.add(d.getDate()); }));
  return { nome: ref.toLocaleDateString("pt-BR", { month: "short" }).replace(".", ""), dias: Array.from({ length: diasNoMes }, (_, i) => treinados.has(i + 1) ? 1 : 0) };
}

              <text x="32" y="37" textAnchor="middle" fontSize="16" fontWeight="600" fill={TEXT}>{feitos}/{perfil.dias || "-"}</text>

function TelaCoach({ perfil, exercicios }) {
  const [mensagens, setMensagens] = useState([]);
  const [entrada, setEntrada] = useState("");
  const [carregando, setCarregando] = useState(false);
  const atalhos = ["📈 Analisar meu treino", "💪 Estou estagnado", "📊 Analisar meu volume", "⏱ Treino mais rápido hoje"];
  const contexto = () => "Perfil: objetivo " + perfil.objetivo + ", fase " + perfil.fase + ", " + perfil.dias + "x/semana, peso " + perfil.peso + "kg.\nExercícios: " + JSON.stringify(exercicios.map((e) => ({ nome: e.nome, grupo: e.grupo, pesoAtual: e.pesoAtual, ultimasSessoes: e.historico.slice(-3) })));

  const enviar = async (texto) => {
    if (!texto.trim()) return;
    setMensagens((m) => [...m, { autor: "user", texto }]);
    setEntrada("");
    setCarregando(true);
    try {
      const resposta = await chamarIA("Você é um coach de musculação baseado em evidência (RP, RIR, dupla progressão). " + contexto() + "\n\nPergunta do usuário: " + texto + "\n\nResponda em português, direto, em no máximo 3 frases.");
      setMensagens((m) => [...m, { autor: "ia", texto: resposta }]);
    } catch (e) {
      setMensagens((m) => [...m, { autor: "ia", texto: getApiKey() ? "não consegui analisar agora — verifique sua conexão e tente de novo." : "configure sua chave de API da Anthropic na aba Perfil pra eu poder responder." }]);

  return (
    <div className="px-5 pt-6 pb-4 flex flex-col" style={{ minHeight: 560 }}>
      <h2 className="text-xl font-semibold" style={{ color: TEXT }}>Coach</h2>
      <div className="flex gap-2 mt-3 overflow-x-auto pb-1">{atalhos.map((a) => <button key={a} onClick={() => enviar(a)} className="whitespace-nowrap text-sm px-3.5 py-2.5 rounded-full" style={{ background: SURFACE, border: "1px solid " + BORDER, color: TEXT }}>{a}</button>)}</div>

        {mensagens.map((m, i) => <div key={i} className="rounded-xl p-3 text-sm" style={m.autor === "user" ? { background: GOLD, color: BG, marginLeft: "20%" } : { background: SURFACE, color: MUTED2, border: "1px solid " + BORDER }}>{m.texto}</div>)}

        {mensagens.length === 0 && !carregando && <p className="text-sm text-center mt-8" style={{ color: MUTED }}>toque num atalho ou escreva sua pergunta</p>}
      </div>
      <div className="flex items-center gap-2 mt-3 rounded-full px-4 py-3" style={{ background: SURFACE, border: "1px solid " + BORDER }}>
        <input value={entrada} onChange={(e) => setEntrada(e.target.value)} onKeyDown={(e) => e.key === "Enter" && enviar(entrada)} placeholder="pergunte algo..." className="flex-1 bg-transparent text-sm outline-none" style={{ color: TEXT }} />

function App() {
  const [perfil, setPerfil] = useState(() => storage.get(PERFIL_KEY));
  const [exercicios, setExercicios] = useState(() => storage.get(EXERCICIOS_KEY) || []);
  const [aba, setAba] = useState("inicio");
  const [abertoId, setAbertoId] = useState(null);
  const [mostrarSeletor, setMostrarSeletor] = useState(false);
  const [baseEscolhida, setBaseEscolhida] = useState(null);

  const salvarPerfil = (novo) => { setPerfil(novo); storage.set(PERFIL_KEY, novo); };
  const persistirExercicios = (lista) => { setExercicios(lista); storage.set(EXERCICIOS_KEY, lista); };

  const salvarSessao = async (id, sets) => {
    const exAtual = exercicios.find((e) => e.id === id);
    const historicoAtualizado = [...exAtual.historico, { data: new Date().toISOString(), sets }];
    let lista = exercicios.map((ex) => ex.id === id ? { ...ex, historico: historicoAtualizado, gerandoSugestao: true } : ex);
    setExercicios(lista); storage.set(EXERCICIOS_KEY, lista);
    const sugestao = await gerarSugestaoIA({ ...exAtual, historico: historicoAtualizado }, perfil);
    lista = lista.map((ex) => ex.id === id ? { ...ex, pesoAtual: sugestao.peso, proximaSugestao: sugestao, gerandoSugestao: false } : ex);
    persistirExercicios(lista);
  };

  if (!perfil) return <Onboarding onConcluir={salvarPerfil} />;

  return (
    <div className="mx-auto max-w-md relative" style={{ background: BG, minHeight: "100vh", fontFamily: "system-ui, sans-serif" }}>
      <div>
        {aba === "inicio" && <TelaInicio perfil={perfil} exercicios={exercicios} onIniciar={() => setAba("treino")} />}
        {aba === "treino" && <div className="pb-24"><TelaTreino exercicios={exercicios} abertoId={abertoId} setAbertoId={setAbertoId} onSalvarSessao={salvarSessao} onRemover={(id) => persistirExercicios(exercicios.filter((e) => e.id !== id))} onAbrirSeletor={() => setMostrarSeletor(true)} /></div>}
        {aba === "progresso" && <div className="px-5 pt-16 pb-24 text-center text-sm" style={{ color: MUTED }}>dashboard de volume/hipertrofia — próxima etapa</div>}
        {aba === "coach" && <div className="pb-24"><TelaCoach perfil={perfil} exercicios={exercicios} /></div>}
        {aba === "perfil" && <div className="pb-24"><TelaPerfil perfil={perfil} onAtualizar={salvarPerfil} /></div>}
      </div>
      <NavFlutuante ativa={aba} onMudar={setAba} />
      {mostrarSeletor && !baseEscolhida && <SeletorExercicio onSelecionar={setBaseEscolhida} onFechar={() => setMostrarSeletor(false)} />}
      {baseEscolhida && <ConfigExercicio base={baseEscolhida} onFechar={() => { setBaseEscolhida(null); setMostrarSeletor(false); }} onCriar={(ex) => { persistirExercicios([...exercicios, ex]); setBaseEscolhida(null); setMostrarSeletor(false); }} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("./sw.js").catch(() => {}); });
}
</script>
<script>
  window.addEventListener("error", function (e) {
    document.getElementById("root").innerHTML =
      '<div style="padding:24px;color:#F0EDE6;font-family:monospace;font-size:13px;line-height:1.6;white-space:pre-wrap;">' +
      '<strong style="color:#C9A227;">Erro ao carregar o app:</strong>\n\n' + (e.message || e) +
      '\n\n(arquivo: ' + (e.filename || "?") + ', linha ' + (e.lineno || "?") + ')' +
      '</div>';
  });
</script>
</body>
</html>
